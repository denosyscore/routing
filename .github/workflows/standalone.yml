name: Standalone install

# Installs this package on its own into an empty project, exactly as a user
# would, and runs the README quick start (the php block after the
# `<!-- quickstart -->` marker; `<!-- quickstart requires: vendor/pkg -->`
# also installs packages the README tells users to add). It fails when the package needs code it does
# not require, or when the documented example no longer works.

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  quickstart:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.2', '8.5']
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none

      - name: Install alone and run the README quick start
        run: |
          set -euo pipefail
          name=$(jq -r .name composer.json)
          work=$(mktemp -d)
          php -r '
            $readme = file_get_contents($argv[1]);
            if (!preg_match("/<!-- quickstart(?: requires: ([^>]*?))? -->\s*```php\n(.*?)```/s", $readme, $m)) {
                fwrite(STDERR, "README has no quickstart block.\n");
                exit(1);
            }
            file_put_contents($argv[2], $m[2]);
            file_put_contents($argv[3], trim($m[1] ?? ""));
          ' README.md "$work/quickstart.php" "$work/extra.txt"
          jq -n --arg url "$GITHUB_WORKSPACE" --arg name "$name" '{
            repositories: [{type: "path", url: $url, options: {symlink: false, versions: {($name): "dev-main"}}}],
            "minimum-stability": "dev",
            "prefer-stable": true
          }' > "$work/composer.json"
          cd "$work"
          # Packages the README tells users to install alongside this one.
          extra=()
          read -r -a extra < extra.txt || true
          composer require --no-interaction --no-progress "$name:dev-main" ${extra[@]+"${extra[@]}"}
          php quickstart.php
